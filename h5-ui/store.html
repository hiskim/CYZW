<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="../shared/design-tokens.css">
  <title>商城</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: transparent; color: var(--color-text-primary); font: var(--font-lg)/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { padding: var(--space-xl); display: grid; gap: var(--space-lg); }
    header, .goods, .goods__meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
    h1 { margin: 0; font-size: var(--font-xxl); }
    .balance { color: var(--color-success); font-size: var(--font-md); }
    .goods { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-card); padding: var(--space-lg); }
    .goods h2 { margin: 0; font-size: var(--font-xl); }
    .goods p { margin: var(--space-sm) 0 0; color: var(--color-text-secondary); font-size: var(--font-md); }
    button { min-width: 44px; min-height: 44px; border: 0; border-radius: var(--radius-control); background: var(--color-primary-button); color: var(--color-text-primary); font: inherit; padding: 0 var(--space-md); cursor: pointer; }
  </style>
</head>
<body>
  <!-- BRIDGE: emits ready { pageName: 'store' }; purchase { itemID } requests a native-authorized purchase flow. -->
  <main>
    <header><h1>商城</h1><span class="balance">钻石 1,280</span></header>
    <section class="goods"><div><h2>每日补给</h2><p>每日限购一次</p></div><button data-item="daily-supply">兑换</button></section>
    <section class="goods"><div><h2>冒险补给包</h2><p>体力与常用材料</p></div><button data-item="adventure-pack">购买</button></section>
  </main>
  <script>
    const send = (event, payload) => window.webkit?.messageHandlers?.engineHost?.postMessage({ event, payload });
    document.addEventListener('DOMContentLoaded', () => send('ready', { pageName: 'store' }));
    document.querySelectorAll('[data-item]').forEach((button) => button.addEventListener('click', () => send('purchase', { itemID: button.dataset.item })));
  </script>
</body>
</html>
